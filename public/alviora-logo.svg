<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
  </defs>
  <!-- 45-degree diamond rotated container -->
  <g transform="translate(300, 300) rotate(45) scale(0.92)" stroke="url(#logo-grad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="arm">
      <!-- Outer hook -->
      <path d="M -180,-180 L 140,-180 A 40,40 0 0,1 180,-140 L 180,-20 A 20,20 0 0,1 160,0 L 80,0" stroke-width="26" />
      <!-- Middle winding path -->
      <path d="M -120,-120 L 80,-120 A 20,20 0 0,1 100,-100 L 100,-60 A 20,20 0 0,1 80,-40 L -20,-40 A 20,20 0 0,0 -40,-20 L -40,40" stroke-width="26" />
      <!-- Inner arm to center -->
      <path d="M -60,-60 L 20,-60 A 20,20 0 0,1 40,-40 L 40,20" stroke-width="26" />
      <!-- Kufic Nuqta / Dot -->
      <rect x="115" y="-30" width="26" height="26" rx="8" fill="url(#logo-grad)" stroke="none" />
    </g>
    <use href="#arm" transform="rotate(90)" />
    <use href="#arm" transform="rotate(180)" />
    <use href="#arm" transform="rotate(270)" />
  </g>
</svg>
